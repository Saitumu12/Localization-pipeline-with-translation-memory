services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: loc
      POSTGRES_PASSWORD: locpass
      POSTGRES_DB: loc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loc -d loc"]
      interval: 3s
      timeout: 3s
      retries: 20

  embeddings:
    build: ./embedsvc
    ports:
      - "8081:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
